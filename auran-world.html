<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auran World | AuranInspire</title>
<meta name="description" content="Auran World — the full AuranInspire platform, in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f3a; --ink:#0d1420; --blue:#1d5fd6; --blue-deep:#123a8c;
  --grey-600:#5c6675; --grey-300:#e2e6eb;
  --white:#fff; --font:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);color:var(--navy);-webkit-font-smoothing:antialiased;line-height:1.6;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;line-height:1.18;}
.eyebrow{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:.8rem;}

.top-bar{max-width:1280px;margin:0 auto;padding:1.6rem 2rem 0;}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;color:var(--grey-600);}
.back-link:hover{color:var(--blue-deep);}

.world-band{
  position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 12% 15%, rgba(29,95,214,.16), transparent 42%),
    radial-gradient(circle at 88% 10%, rgba(255,176,32,.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(18,58,140,.12), transparent 45%),
    #f6f8fb;
  min-height:calc(100vh - 90px);
  padding:3.5rem 2rem 5rem;
}
.world-inner{max-width:1280px;margin:0 auto;}
.world-title{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:.6rem;}
.world-sub{color:var(--grey-600);max-width:520px;margin-bottom:3rem;}

.platform-grid{display:flex;flex-wrap:wrap;gap:2.6rem 1.8rem;background:transparent;border:none;}
.platform-card{
  background:transparent; border:none; box-shadow:none; padding:0;
  display:flex; flex-direction:column; align-items:center;
  flex:0 0 108px; text-align:center;
  transition:transform .38s cubic-bezier(.2,.9,.25,1.35);
}
.platform-card:hover{transform:translateY(-6px) scale(1.06);}
.platform-icon{
  display:flex; align-items:center; justify-content:center;
  width:60px; height:60px; margin:0 auto 1.1rem;
  border-radius:16px; color:#fff; font-size:1.35rem;
  box-shadow:0 10px 22px rgba(18,58,140,.4), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .38s cubic-bezier(.2,.9,.25,1.35);
  background:linear-gradient(155deg,#2f6fe0,#123a8c);
}
.platform-card:hover .platform-icon{transform:scale(1.08) rotate(-2deg);}
.platform-card:nth-child(4n+2) .platform-icon{background:linear-gradient(155deg,#ffc24d,#e08a00);box-shadow:0 10px 22px rgba(224,138,0,.35),inset 0 1px 0 rgba(255,255,255,.3);}
.platform-card:nth-child(4n+3) .platform-icon{background:linear-gradient(155deg,#3ddc9e,#0f9e6e);box-shadow:0 10px 22px rgba(15,158,110,.32),inset 0 1px 0 rgba(255,255,255,.3);}
.platform-card:nth-child(4n+4) .platform-icon{background:linear-gradient(155deg,#7c7ff0,#4b3fc9);box-shadow:0 10px 22px rgba(75,63,201,.32),inset 0 1px 0 rgba(255,255,255,.3);}
.platform-card h4{font-size:.92rem;font-weight:600;color:var(--navy);white-space:normal;line-height:1.3;min-height:2.5em;display:flex;align-items:flex-start;justify-content:center;}
.platform-card.wide{flex:0 0 150px;}
.platform-card.wide h4{white-space:nowrap;}

@media (max-width:700px){
  .platform-grid{gap:2rem 1.4rem;}
  .platform-card{flex:0 0 84px;}
  .platform-card.wide{flex:0 0 130px;}
  .platform-icon{width:52px;height:52px;}
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">← Back to AuranInspire</a>
</div>

<section class="world-band">
  <div class="world-inner">

    <div class="platform-grid">
      <a href="auran-studio.html" class="platform-card">

            <polygon points="12,4.5 14,12 12,19.5 10,12" fill="currentColor" stroke="none"/>

            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>

        </span>

            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="12" x2="15.5" y2="8"/>

          </svg>
        </span>
        <h4>Auran TestIT</h4>
      </a>
      <a href="learnit.html" class="platform-card">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="12,6 14.5,13.5 12,11.5 9.5,13.5" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <h4>Auran LearnIT</h4>
      </a>
      <a href="indicators.html" class="platform-card wide">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="12" x2="12" y2="6.5"/>
            <line x1="12" y1="12" x2="16" y2="13.5"/>

          </svg>
        </span>
        <h4>Auran Indicators</h4>
      </a>
      <a href="taskit.html" class="platform-card">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="12" x2="12" y2="7.5"/>
            <line x1="12" y1="12" x2="15" y2="12"/>
            <line x1="12" y1="3.3" x2="12" y2="4.3" stroke-width="2"/>
            <line x1="19.7" y1="12" x2="20.7" y2="12" stroke-width="2"/>
          </svg>
        </span>
        <h4>Auran TaskIT</h4>
      </a>
    </div>
  </div>
</section>

</body>
</html>
