<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviation Music Zone | AuranInspire</title>
<meta name="description" content="Aviation-themed songs and videos from AuranInspire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--ink:#0d1420;--blue:#1d5fd6;--blue-deep:#123a8c;--grey-600:#5c6675;--grey-300:#e2e6eb;--grey-100:#f6f8fa;--font:'Inter',sans-serif;--mono:'IBM Plex Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.6;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;}
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid var(--grey-300);backdrop-filter:blur(6px);}
.nav-wrap{max-width:1280px;margin:0 auto;padding:.95rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;}
.logo-block{display:flex;flex-direction:column;line-height:1.1;}
.logo{font-weight:800;font-size:1.2rem;color:var(--navy);}
.logo span{color:var(--blue-deep);}
.logo-tag{font-family:var(--mono);font-size:.64rem;color:var(--grey-600);margin-top:2px;}
.main-nav{display:flex;flex-wrap:wrap;gap:1.2rem 1.8rem;}
.main-nav a{font-size:.87rem;font-weight:500;color:var(--grey-600);}
.main-nav a:hover,.main-nav a.active{color:var(--blue-deep);}
.btn{display:inline-block;padding:.65rem 1.3rem;font-weight:600;font-size:.82rem;border-radius:4px;border:none;cursor:pointer;font-family:inherit;background:var(--navy);color:#fff;}
.hero{background:linear-gradient(135deg,#0b1f3a,#123a8c);color:#fff;padding:4rem 2rem 3rem;text-align:center;}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;color:#a9c2f2;margin-bottom:.8rem;}
.hero h1{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-bottom:.6rem;}
.hero p{color:#cbd7ec;max-width:560px;margin:0 auto;}
.section{max-width:1100px;margin:0 auto;padding:3rem 2rem 4rem;}
.section h2{font-size:1.4rem;margin-bottom:1.2rem;}
.player{background:linear-gradient(135deg,#0b1f3a,#123a8c);color:#fff;border-radius:18px;padding:1.4rem;display:grid;grid-template-columns:120px 1fr;gap:1.2rem;align-items:center;margin-bottom:1.4rem;}
.cover{width:120px;aspect-ratio:1;border-radius:12px;background:#1d5fd6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4rem;}
.p-title{font-size:1.15rem;font-weight:700;}
.p-sub{font-size:.8rem;color:#a9c2f2;margin-bottom:.7rem;}
.player audio{width:100%;}
.tracks{display:grid;gap:.5rem;}
.track{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;border:1px solid var(--grey-300);background:#fff;border-radius:12px;padding:.7rem 1rem;cursor:pointer;font-family:inherit;}
.track:hover{border-color:var(--blue);}
.track.on{border-color:var(--blue);background:#eef4ff;}
.t-no{font-family:var(--mono);font-size:.74rem;color:#fff;background:var(--navy);border-radius:8px;min-width:2rem;text-align:center;padding:.3rem;}
.t-name{font-weight:600;font-size:.95rem;}
.t-meta{display:block;font-size:.75rem;color:var(--grey-600);font-weight:400;}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem;}
.vcard{border:1px solid var(--grey-300);border-radius:14px;overflow:hidden;background:#fff;}
.vframe{position:relative;aspect-ratio:16/9;background:#000;}
.vframe iframe,.vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vbody{padding:.8rem 1rem 1rem;}
.vbody h3{font-size:.98rem;}
.vbody p{font-size:.8rem;color:var(--grey-600);}
.empty{color:var(--grey-600);padding:1rem 0;}
.footer{background:var(--ink);color:#8b96a8;text-align:center;padding:1.8rem 1rem;font-size:.8rem;}
@media (max-width:600px){.player{grid-template-columns:1fr;}.cover{width:90px;}}
</style>
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <div class="logo-block">
      <a href="index.html" class="logo">Auran<span>Inspire</span></a>
      <span class="logo-tag">Designed by AK</span>
    </div>
    <nav class="main-nav">
      <a href="index.html#about">Briefing</a>
      <a href="auran-world.html">Hangar</a>
      <a href="index.html#insights">Radar</a>
      <a href="index.html#events">Runway</a>
      <a href="index.html#contact">Tower</a>
      <a href="teaching.html">Teaching</a>
      <a href="music.html" class="active">Music Zone</a>
    </nav>
    <a href="index.html" class="btn btn-primary">Back to Home</a>
  </div>
</header>
<section class="hero">
  <p class="eyebrow">AVIATION MUSIC ZONE</p>
  <h1>Songs &amp; Videos</h1>
  <p>Aviation-themed music and videos from AuranInspire.</p>
</section>
<section class="section">
  <h2>Songs</h2>
  <div class="player" id="player" style="display:none;">
    <div class="cover" id="cover">♪</div>
    <div><div class="p-title" id="pTitle"></div><div class="p-sub" id="pSub"></div><audio id="audio" controls preload="none"></audio></div>
  </div>
  <div class="tracks" id="tracks"></div>
  <p class="empty" id="noSongs" style="display:none;">Songs are coming soon.</p>
</section>
<section class="section" style="padding-top:0;">
  <h2>Videos</h2>
  <div class="vgrid" id="videos"></div>
  <p class="empty" id="noVideos" style="display:none;">Videos are coming soon.</p>
</section>
<footer class="footer">© AuranInspire · Designed by AK</footer>
<script>
// ===== Add songs here: { title, artist, file: "assets/music/song.mp3", cover: "assets/music/cover.jpg" (optional) } =====
var SONGS = [
  { title: "AuranAviation Anthem", artist: "AuranInspire", file: "assets/music/auranaviation-anthem.mp3" }
];
// ===== Add videos here: { title, desc, youtube: "VIDEO_ID" }  or  { title, desc, file: "assets/music/video.mp4" } =====
var VIDEOS = [
];
(function() {
  var tracks = document.getElementById('tracks'), audio = document.getElementById('audio'), player = document.getElementById('player');
  var cur = -1;
  function play(i) {
    var s = SONGS[i]; cur = i;
    player.style.display = 'grid';
    document.getElementById('pTitle').textContent = s.title;
    document.getElementById('pSub').textContent = s.artist || '';
    var c = document.getElementById('cover'); c.style.backgroundImage = s.cover ? 'url(' + s.cover + ')' : ''; c.textContent = s.cover ? '' : '♪';
    audio.src = s.file; audio.play().catch(function() {});
    Array.prototype.forEach.call(tracks.children, function(t, k) { t.classList.toggle('on', k === i); });
  }
  SONGS.forEach(function(s, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'track';
    b.innerHTML = '<span class="t-no"></span><span class="t-name"><span class="tn"></span><span class="t-meta"></span></span>';
    b.querySelector('.t-no').textContent = i + 1; b.querySelector('.tn').textContent = s.title; b.querySelector('.t-meta').textContent = s.artist || '';
    b.addEventListener('click', function() { play(i); }); tracks.appendChild(b);
  });
  audio.addEventListener('ended', function() { if (cur + 1 < SONGS.length) play(cur + 1); });
  document.getElementById('noSongs').style.display = SONGS.length ? 'none' : 'block';
  var vg = document.getElementById('videos');
  VIDEOS.forEach(function(v) {
    var c = document.createElement('div'); c.className = 'vcard';
    var f = document.createElement('div'); f.className = 'vframe';
    if (v.youtube && /^[\w-]{6,20}$/.test(v.youtube)) { var i = document.createElement('iframe'); i.src = 'https://www.youtube-nocookie.com/embed/' + v.youtube + '?rel=0'; i.allow = 'fullscreen; encrypted-media; picture-in-picture'; i.loading = 'lazy'; i.title = v.title; f.appendChild(i); }
    else if (v.file) { var m = document.createElement('video'); m.src = v.file; m.controls = true; m.preload = 'metadata'; m.setAttribute('playsinline', ''); f.appendChild(m); }
    var b = document.createElement('div'); b.className = 'vbody'; var h = document.createElement('h3'); h.textContent = v.title; var d = document.createElement('p'); d.textContent = v.desc || '';
    b.appendChild(h); b.appendChild(d); c.appendChild(f); c.appendChild(b); vg.appendChild(c);
  });
  document.getElementById('noVideos').style.display = VIDEOS.length ? 'none' : 'block';
})();
</script>
</body>
</html>
