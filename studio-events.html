<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auran Studio - Welcome on board</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; background: #f7f7f7; color: #1a1a1a; }
.header { background: #0c2340; color: #fff; padding: 20px 32px; }
.header a { color: #b5d4f4; text-decoration: none; font-size: 13px; }
.header h1 { margin: 8px 0 4px; font-size: 24px; }
.header p { margin: 0; color: #b5d4f4; font-size: 14px; }
.content { max-width: 900px; margin: 0 auto; padding: 32px; }
.folder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; }
.folder-tile { text-decoration: none; color: inherit; cursor: pointer; }
.folder-tab { width: 56px; height: 14px; border-radius: 6px 6px 0 0; margin-left: 12px; }
.folder-body { height: 86px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-top: -1px; }
.folder-name { margin-top: 10px; text-align: center; font-size: 13px; font-weight: 600; }
.folder-count { text-align: center; font-size: 11px; color: #888; }
</style>
</head>
<body>

<div class="header">

</div>

<div class="folder-body" style="background:#E6F1FB; border:1px solid #85B7EB; color:#0C447C">&#128240;</div>
<div class="folder-name">Magazine</div>
